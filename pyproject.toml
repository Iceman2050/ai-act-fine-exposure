[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-fine-exposure"
version = "1.0.0"
description = "EU AI Act draft fine-exposure calculator with SME rules and per-day penalties (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
ai-act-fine-exposure = "ai_act_fine_exposure:main"

[tool.setuptools]
py-modules = ["ai_act_fine_exposure"]
